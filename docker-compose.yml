# PHANTOM — full stack
#
# Boots Postgres, Neo4j, Redis, the FastAPI backend, and (later) the Celery
# worker. The frontend is added on Day 6 — see PHANTOM_MASTER_PLAN.md §9.
#
# Run:
#   docker compose up
#
# First-time prereq:
#   python backend/download_models.py
# (so the ./models volume isn't empty when the backend starts)

services:
  postgres:
    image: postgres:15.5-alpine
    container_name: phantom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phantom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phantom_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-phantom}
    ports:
      - "5432:5432"
    volumes:
      - phantom_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phantom} -d ${POSTGRES_DB:-phantom}"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5.15-community
    container_name: phantom-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-phantom_dev_pw}
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - phantom_neo4j_data:/data
      - phantom_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: phantom-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - phantom_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phantom-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Override host-style env vars to use docker service names.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-phantom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phantom_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-phantom}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-phantom_dev_pw}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      TRANSFORMERS_CACHE: /app/models
      SENTENCE_TRANSFORMERS_HOME: /app/models
      HF_HUB_OFFLINE: "1"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENV: ${ENV:-development}
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./keys:/app/keys
      # In dev, uncomment to hot-reload code changes:
      # - ./backend:/app

  # Celery worker — added on Day 5 when tasks are implemented.
  # Uncomment when workers/tasks.py exists.
  #
  # celery_worker:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: phantom-celery
  #   restart: unless-stopped
  #   depends_on:
  #     - backend
  #   environment:
  #     POSTGRES_HOST: postgres
  #     NEO4J_URI: bolt://neo4j:7687
  #     REDIS_URL: redis://redis:6379/0
  #     CELERY_BROKER_URL: redis://redis:6379/0
  #     CELERY_RESULT_BACKEND: redis://redis:6379/1
  #     TRANSFORMERS_CACHE: /app/models
  #     SENTENCE_TRANSFORMERS_HOME: /app/models
  #     HF_HUB_OFFLINE: "1"
  #   volumes:
  #     - ./models:/app/models:ro
  #     - ./keys:/app/keys
  #   command: ["celery", "-A", "workers.celery_app", "worker", "--loglevel=info", "--concurrency=2"]

  # Frontend — added on Day 6 after Section 8 theme is locked in.

volumes:
  phantom_pg_data:
  phantom_neo4j_data:
  phantom_neo4j_logs:
  phantom_redis_data:
